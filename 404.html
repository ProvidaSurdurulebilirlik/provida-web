<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı | Provida Sürdürülebilirlik Danışmanlığı</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #002c6e; --green: #007a27; --gray-600: #6A7064; --white: #fff; }
    body { font-family: 'Poppins', sans-serif; background: #001233; color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .wheel { width: 80px; height: 80px; border-radius: 50%; background: conic-gradient(#E5243B 0deg 21.18deg,#DDA63A 21.18deg 42.35deg,#4C9F38 42.35deg 63.53deg,#C5192D 63.53deg 84.71deg,#FF3A21 84.71deg 105.88deg,#26BDE2 105.88deg 127.06deg,#FCC30B 127.06deg 148.24deg,#A21942 148.24deg 169.41deg,#FD6925 169.41deg 190.59deg,#DD1367 190.59deg 211.76deg,#FD9D24 211.76deg 232.94deg,#BF8B2E 232.94deg 254.12deg,#3F7E44 254.12deg 275.29deg,#0A97D9 275.29deg 296.47deg,#56C02B 296.47deg 317.65deg,#00689D 317.65deg 338.82deg,#19486A 338.82deg 360deg); -webkit-mask: radial-gradient(circle, transparent 55%, black 55%); mask: radial-gradient(circle, transparent 55%, black 55%); margin: 0 auto 2rem; animation: spin 20s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-family: 'Cormorant', Georgia, serif; font-size: clamp(3rem, 10vw, 6rem); font-weight: 600; line-height: 1; margin-bottom: 0.5rem; color: var(--white); }
    h2 { font-family: 'Cormorant', Georgia, serif; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 400; color: rgba(255,255,255,0.7); margin-bottom: 1.5rem; }
    p { font-size: 1rem; color: rgba(255,255,255,0.5); margin-bottom: 2.5rem; max-width: 400px; line-height: 1.7; }
    a { display: inline-block; padding: 0.875rem 2rem; background: var(--green); color: var(--white); border-radius: 4px; font-weight: 600; font-size: 0.9375rem; text-decoration: none; transition: background 0.2s; }
    a:hover { background: #005c1d; }
  </style>
</head>
<body>
  <div class="wheel"></div>
  <h1>404</h1>
  <h2>Sayfa bulunamadı.</h2>
  <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir.</p>
  <a href="/">Ana Sayfaya Dön</a>
</body>
</html>
